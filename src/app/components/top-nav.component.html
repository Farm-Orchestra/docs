 <nav class="topnav">
      <app-main-logo variant="default" [clickable]="true" (navigate)="navigate.emit({})"></app-main-logo>
      <button
        type="button"
        class="nav-link"
        [class.active]="!current"
        (click)="navigate.emit({ notebook: undefined })"
      >
        ALL
      </button>
      @for (notebook of notebooks; track notebook) {
        <button
          type="button"
          class="nav-link"
          [class.active]="current === notebook"
          (click)="navigate.emit({ notebook })"
        >
          {{ notebook.toUpperCase() }}
        </button>
      }
      <div class="right-slot">
        <ng-content></ng-content>
      </div>
    </nav>
